name: Feature Request
description: Suggest a new feature or enhancement for containerd
labels: ["kind/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest a feature!
        Please fill out the sections below to help us understand your request.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting a feature request.
      options:
        - label: I have searched existing issues and this feature has not been requested before.
          required: true
        - label: I have reviewed the containerd roadmap and this feature is not already planned.
          required: false

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A clear and concise description of the feature you are requesting.
      placeholder: Briefly describe the feature...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation and Use Case
      description: |
        Why is this feature needed? What problem does it solve?
        Please describe the use case(s) that would benefit from this feature.
      placeholder: Describe the problem or use case...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: |
        Describe the solution you would like to see implemented.
        Include any relevant design ideas, API changes, or implementation details.
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Have you considered any alternative solutions or workarounds?
        Please describe them here.
      placeholder: Describe any alternatives you have considered...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of containerd does this feature relate to?
      multiple: true
      options:
        - API
        - CRI
        - Snapshotter
        - Runtime
        - Image / Content Store
        - Networking
        - Security
        - CLI (ctr)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: |
        Add any other context, screenshots, or references that might be helpful.
      placeholder: Any additional information...
    validations:
      required: false
